<!DOCTYPE html>
<html lang="en" data-theme="terminal" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarm Clock — Terminal</title>
<style>
:root[data-mode=dark]{
  --bg:#050805; --surface:#0a140c; --border:#143520; --text:#9fdfb6; --muted:#3f7a55;
  --digit:#58ff9e; --accent:#58ff9e; --accent-contrast:#03140a;
  --danger:#ff6b6b; --danger-contrast:#1a0505;
  --glow:0 0 14px rgba(80,255,150,.45);
}
:root[data-mode=light]{
  --bg:#f4f3ea; --surface:#e9e8db; --border:#d5d4c2; --text:#4a6a54; --muted:#8a9a8e;
  --digit:#1f6b3f; --accent:#1f6b3f; --accent-contrast:#f4f3ea;
  --danger:#c0392b; --danger-contrast:#fdf3f1;
  --glow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;min-height:100vh;display:flex;flex-direction:column;transition:background-color .3s,color .3s}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem}
h1{color:var(--muted);font-size:.85rem;font-weight:400;letter-spacing:.1em}
.mode-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:.35rem .8rem}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.1rem;padding:1rem 2rem 4rem;max-width:52rem;margin:0 auto;width:100%}
.time{font-size:clamp(3rem,12vw,5.5rem);font-weight:700;color:var(--digit);text-shadow:var(--glow);letter-spacing:.04em}
.log{font-size:.95rem;line-height:1.8;white-space:pre-wrap}
.log .p{color:var(--muted)}
.log .ok{color:var(--digit);font-weight:700}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--digit);vertical-align:-.15em;animation:blink 1.1s steps(1) infinite}
/* command form styled as a prompt line */
.cmd{display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.cmd .p{color:var(--muted)}
.cmd input{flex:1;background:none;border:0;outline:none;color:var(--text);caret-color:var(--digit)}
.hintline{font-size:.8rem;color:var(--muted)}
/* Ringing: screen inverts */
.ringing{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;z-index:10}
body.is-ringing .ringing{display:flex}
.ringing .banner{background:var(--accent);color:var(--accent-contrast);font-weight:700;font-size:1.1rem;padding:.35rem .9rem;animation:blink 1s steps(1) infinite}
.ringing time{font-size:clamp(4rem,18vw,8rem);font-weight:700;color:var(--digit);text-shadow:var(--glow)}
.ringing .keys{font-size:1rem}
.ringing button{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:.6rem 1.1rem}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <h1>alarm-clock v2</h1>
  <button class="mode-toggle" id="modeToggle" type="button">dark</button>
</header>
<main>
  <div class="time" id="time" role="timer" aria-label="Current time">00:00:00</div>
  <div class="log" id="log"><span class="p">$</span> alarm --help
set an alarm:  <span class="ok">alarm 07:30</span>  ·  <span class="ok">alarm in 20m</span></div>
  <form class="cmd" id="cmdForm"><span class="p">$</span><input id="cmdInput" autocomplete="off" spellcheck="false" aria-label="Command" placeholder="alarm 07:30"><span class="cursor" aria-hidden="true"></span></form>
  <p class="hintline" id="next">no alarm set</p>
</main>
<div class="ringing" role="alertdialog" aria-label="Alarm ringing">
  <span class="banner" id="ringBanner">!! ALARM 07:30 !!</span>
  <time id="ringTime">07:30</time>
  <p class="keys">[space] snooze 5m&nbsp;&nbsp;&nbsp;[q] stop</p>
  <div style="display:flex;gap:.6rem"><button id="snoozeBtn" type="button">snooze</button><button id="stopBtn" type="button">stop</button></div>
</div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
let alarm=null,ctx=null,beepTimer=null;
let mode=localStorage.getItem("clock-mode")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function applyMode(){document.documentElement.dataset.mode=mode;$("#modeToggle").textContent=mode;}
$("#modeToggle").onclick=()=>{mode=mode==="dark"?"light":"dark";localStorage.setItem("clock-mode",mode);applyMode();};applyMode();
function logLine(html){$("#log").insertAdjacentHTML("beforeend","\n"+html);}
// command grammar: "alarm HH:MM" | "alarm in Nm" | "alarm in Nh" | "snooze" | "stop"
$("#cmdForm").onsubmit=e=>{e.preventDefault();const v=$("#cmdInput").value.trim();$("#cmdInput").value="";
  logLine(`<span class="p">$</span> ${v.replace(/</g,"&lt;")}`);
  let m;
  if((m=v.match(/^alarm\s+(\d{1,2}):(\d{2})$/))){const t=new Date();t.setHours(+m[1],+m[2],0,0);if(t<=new Date())t.setDate(t.getDate()+1);setAlarm(t);}
  else if((m=v.match(/^alarm\s+in\s+(\d+)\s*(m|h)$/))){setAlarm(new Date(Date.now()+ +m[1]*(m[2]==="h"?3600000:60000)));}
  else if(v==="stop"){stop();logLine(`<span class="ok">ok</span> — alarm cleared`);}
  else logLine(`<span class="p">unknown — try: alarm 07:30 · alarm in 20m · stop</span>`);};
function setAlarm(t){alarm=t;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();updateNext();logLine(`<span class="ok">ok</span> — rings in ${ringsIn()}`);}
function ringsIn(){const m=Math.max(0,Math.round((alarm-Date.now())/60000));return `${Math.floor(m/60)}h ${m%60}m`;}
function updateNext(){if(!alarm){$("#next").textContent="no alarm set";return;}const hm=pad(alarm.getHours())+":"+pad(alarm.getMinutes());$("#next").textContent=`alarm ${hm} — rings in ${ringsIn()}`;$("#ringTime").textContent=hm;$("#ringBanner").textContent=`!! ALARM ${hm} !!`;}
function beep(){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=1040;g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.15);}
function ring(){document.body.classList.add("is-ringing");beep();beepTimer=setInterval(beep,500);}
function stopRing(){document.body.classList.remove("is-ringing");clearInterval(beepTimer);}
function snooze(){stopRing();alarm=new Date(Date.now()+5*60000);updateNext();logLine(`<span class="ok">snoozed</span> — rings in 5m`);}
function stop(){stopRing();alarm=null;updateNext();}
$("#snoozeBtn").onclick=snooze;$("#stopBtn").onclick=stop;
addEventListener("keydown",e=>{if(!document.body.classList.contains("is-ringing"))return;if(e.code==="Space"){e.preventDefault();snooze();}if(e.key==="q"||e.key==="Escape")stop();});
function loop(){const d=new Date();$("#time").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
if(alarm){updateNext();if(!document.body.classList.contains("is-ringing")&&d>=alarm)ring();}
setTimeout(loop,1000-d.getMilliseconds());}
loop();$("#cmdInput").focus();
</script>
</body>
</html>
