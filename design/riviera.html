<!DOCTYPE html>
<html lang="en" data-theme="riviera" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarm Clock — Riviera</title>
<style>
:root[data-mode=light]{
  --bg:#f3ead9; --surface:#ffffff; --border:#e6d8bd; --text:#3a3632; --muted:#8a7f6a;
  --face:#fdf7ea; --face-border:#e6d8bd; --dots:#3a3632;
  --shape-1:#d96f32; --shape-2:#2f7f74; --shape-3:#e3b230; --shape-4:#b6543f;
  --accent:#2f7f74; --accent-contrast:#ffffff; --chip:#e3b230; --chip-text:#8a6a1c;
}
:root[data-mode=dark]{
  --bg:#171c26; --surface:#202836; --border:#2c3648; --text:#dfe4ec; --muted:#8b95a8;
  --face:#202836; --face-border:#2c3648; --dots:#8b95a8;
  --shape-1:#e0803f; --shape-2:#4aa396; --shape-3:#e9c04a; --shape-4:#cf6a52;
  --accent:#4aa396; --accent-contrast:#0c1512; --chip:#e9c04a; --chip-text:#e9c04a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background-color .3s,color .3s}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem}
h1{color:var(--muted);font-size:.95rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.mode-toggle{background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--muted);padding:.4rem .9rem}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:1rem 1.5rem 4rem}
.dial{width:min(60vmin,380px);height:min(60vmin,380px)}
.next{color:var(--muted);font-size:.95rem}
.controls{display:flex;flex-direction:column;gap:1rem;align-items:center}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center}
.chip{border:1.5px solid var(--chip);border-radius:999px;background:none;color:var(--chip-text);font-size:.85rem;font-weight:600;padding:.5rem .9rem}
input{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;font-size:1.3rem;font-weight:700;padding:.45rem .9rem}
input[type=number]{width:5rem;text-align:center}
.submit{border:0;border-radius:12px;background:var(--accent);color:var(--accent-contrast);font-weight:700;padding:.75rem 1.3rem}
.unit{color:var(--muted)}
/* Ringing: friendly morning card, shapes bounce */
.ringing{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;z-index:10}
body.is-ringing .ringing{display:flex}
.ringing .shapes{display:flex;gap:1rem}
.ringing .shapes i{width:22px;height:22px;display:block;animation:bounce 1s ease-in-out infinite}
.ringing .shapes i:nth-child(1){background:var(--shape-1);border-radius:50%}
.ringing .shapes i:nth-child(2){background:var(--shape-2);animation-delay:.12s}
.ringing .shapes i:nth-child(3){background:var(--shape-3);clip-path:polygon(50% 0,100% 100%,0 100%);animation-delay:.24s}
.ringing .shapes i:nth-child(4){background:var(--shape-4);transform:rotate(45deg);animation-delay:.36s}
.ringing .hello{font-size:1.5rem;font-weight:700}
.ringing time{font-size:clamp(4rem,16vw,8rem);font-weight:700}
.ringing .actions{display:flex;gap:.75rem}
.ringing .snooze{border:0;border-radius:999px;background:var(--shape-3);color:#3a2f10;font-weight:700;padding:.85rem 1.6rem}
.ringing .stop{background:none;border:1.5px solid var(--shape-4);border-radius:999px;color:var(--shape-4);font-weight:600;padding:.85rem 1.2rem}
@keyframes bounce{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <h1>Alarm Clock</h1>
  <button class="mode-toggle" id="modeToggle" type="button">light</button>
</header>
<main>
  <svg class="dial" viewBox="0 0 200 200" role="timer" aria-label="Current time">
    <circle cx="100" cy="100" r="96" fill="var(--face)" stroke="var(--face-border)" stroke-width="1.5"></circle>
    <!-- 12/3/6/9 as geometric shapes; other hours as dots (built in JS) -->
    <circle cx="100" cy="18" r="6.5" fill="var(--shape-1)"></circle>
    <rect x="176" y="94.5" width="11" height="11" fill="var(--shape-2)"></rect>
    <polygon points="100,176 107,188 93,188" fill="var(--shape-3)"></polygon>
    <rect x="8" y="94.5" width="11" height="11" fill="var(--shape-4)" transform="rotate(45 13.5 100)"></rect>
    <g id="dots"></g>
    <line id="hourHand" x1="100" y1="104" x2="100" y2="54" stroke="var(--shape-2)" stroke-width="7" stroke-linecap="round"></line>
    <line id="minHand" x1="100" y1="106" x2="100" y2="28" stroke="var(--shape-4)" stroke-width="5" stroke-linecap="round"></line>
    <g id="secGroup"><line x1="100" y1="112" x2="100" y2="26" stroke="var(--shape-3)" stroke-width="2" stroke-linecap="round"></line><circle cx="100" cy="117" r="5" fill="none" stroke="var(--shape-3)" stroke-width="2"></circle></g>
    <circle cx="100" cy="100" r="4.5" fill="var(--dots)"></circle>
  </svg>
  <p class="next" id="next">No alarm set</p>
  <section class="controls" aria-label="Alarm">
    <!-- Quick-chips stack additively; or set an absolute time -->
    <div class="row">
      <button class="chip" type="button" data-add="10">+10 min</button>
      <button class="chip" type="button" data-add="30">+30 min</button>
      <button class="chip" type="button" data-add="60">+1 h</button>
    </div>
    <form class="row" id="atForm"><input type="time" id="timeInput" value="07:30" required aria-label="Alarm time"><button class="submit" type="submit">Set</button></form>
  </section>
</main>
<div class="ringing" role="alertdialog" aria-label="Alarm ringing">
  <div class="shapes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="hello">Good morning!</p>
  <time id="ringTime">07:30</time>
  <div class="actions"><button class="snooze" id="snoozeBtn" type="button">Snooze</button><button class="stop" id="stopBtn" type="button">Stop</button></div>
</div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
let alarm=null,ctx=null,beepTimer=null,lastSec=-1;
let mode=localStorage.getItem("clock-mode")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function applyMode(){document.documentElement.dataset.mode=mode;$("#modeToggle").textContent=mode;}
$("#modeToggle").onclick=()=>{mode=mode==="dark"?"light":"dark";localStorage.setItem("clock-mode",mode);applyMode();};applyMode();
// dots for the 8 non-quarter hours
const NS="http://www.w3.org/2000/svg",dots=$("#dots");
for(let i=0;i<12;i++){if(i%3===0)continue;const a=i*30*Math.PI/180;
  const c=document.createElementNS(NS,"circle");c.setAttribute("cx",100+82*Math.sin(a));c.setAttribute("cy",100-82*Math.cos(a));c.setAttribute("r",2.4);c.setAttribute("fill","var(--dots)");dots.appendChild(c);}
// quick-chips stack additively onto the current alarm (or now)
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const base=alarm&&alarm>new Date()?alarm.getTime():Date.now();setAlarm(new Date(base+ +b.dataset.add*60000));});
$("#atForm").onsubmit=e=>{e.preventDefault();const[h,m]=$("#timeInput").value.split(":").map(Number);const t=new Date();t.setHours(h,m,0,0);if(t<=new Date())t.setDate(t.getDate()+1);setAlarm(t);};
function setAlarm(t){alarm=t;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();updateNext();}
function updateNext(){if(!alarm){$("#next").textContent="No alarm set";return;}const m=Math.max(0,Math.round((alarm-Date.now())/60000));$("#next").textContent=`Alarm ${pad(alarm.getHours())}:${pad(alarm.getMinutes())} — rings in ${Math.floor(m/60)}h ${m%60}m`;$("#ringTime").textContent=pad(alarm.getHours())+":"+pad(alarm.getMinutes());}
// cheerful major-third two-note chime
function beep(){if(!ctx)return;[[523.25,0],[659.25,.22]].forEach(([f,dt])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.14,ctx.currentTime+dt);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dt+.3);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+dt);o.stop(ctx.currentTime+dt+.35);});}
function ring(){document.body.classList.add("is-ringing");beep();beepTimer=setInterval(beep,1100);}
function stopRing(){document.body.classList.remove("is-ringing");clearInterval(beepTimer);}
function snooze(){stopRing();setAlarm(new Date(Date.now()+9*60000));}
function stop(){stopRing();alarm=null;updateNext();}
$("#snoozeBtn").onclick=snooze;$("#stopBtn").onclick=stop;
addEventListener("keydown",e=>{if(!document.body.classList.contains("is-ringing"))return;if(e.code==="Space"){e.preventDefault();snooze();}if(e.key==="q"||e.key==="Escape")stop();});
function loop(){const d=new Date();
const sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()+d.getSeconds()/60,hr=(d.getHours()%12)+d.getMinutes()/60;
$("#secGroup").setAttribute("transform",`rotate(${sec*6} 100 100)`);
$("#minHand").setAttribute("transform",`rotate(${min*6} 100 100)`);
$("#hourHand").setAttribute("transform",`rotate(${hr*30} 100 100)`);
if(d.getSeconds()!==lastSec){lastSec=d.getSeconds();if(alarm){updateNext();if(!document.body.classList.contains("is-ringing")&&d>=alarm)ring();}}
requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
